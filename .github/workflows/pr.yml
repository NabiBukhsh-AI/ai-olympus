name: Pull Request Quality Checks

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  quality-checks:
    name: "🔍 Quality Checks (PHP 8.5)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: '8.5'
          extensions: pcov, dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: pcov

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: "🔒 Security Audit"
        run: composer security-audit

      - name: "📝 Composer Normalize"
        run: composer composer-normalize-check

      - name: "🔍 PHP CodeSniffer"
        run: composer phpcs-check

      - name: "🎨 Laravel Pint"
        run: composer pint-check

      - name: "🔄 Rector"
        run: composer rector-check

      - name: "🔎 PHPStan Analysis"
        run: composer analyse

      - name: "🐚 ShellCheck"
        run: composer shellcheck

      - name: "🧪 Shell Self-Tests"
        run: composer shell-self-tests

      - name: "📊 Coverage Tests"
        run: composer test:coverage

  installer-compatibility:
    name: "Installer (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Install the distribution in a clean consuming project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ai-olympus-dist" "$RUNNER_TEMP/ai-olympus-consumer"
          composer --no-plugins --no-scripts archive --format=zip --dir="$RUNNER_TEMP/ai-olympus-dist" --file=ai-olympus
          php <<'PHP'
          <?php
          $package = json_decode(file_get_contents('composer.json'), true, 512, JSON_THROW_ON_ERROR);
          $package['version'] = '0.1';
          $package['dist'] = ['type' => 'zip', 'url' => 'file://' . getenv('RUNNER_TEMP') . '/ai-olympus-dist/ai-olympus.zip'];
          $consumer = [
              'name' => 'ai-olympus/compatibility-test',
              'require' => ['pekral/ai-olympus' => '0.1'],
              'repositories' => [['type' => 'package', 'package' => $package], ['packagist.org' => false]],
              'config' => ['allow-plugins' => ['pekral/ai-olympus' => true]],
          ];
          file_put_contents(getenv('RUNNER_TEMP') . '/ai-olympus-consumer/composer.json', json_encode($consumer, JSON_THROW_ON_ERROR | JSON_PRETTY_PRINT));
          PHP
          cd "$RUNNER_TEMP/ai-olympus-consumer"
          composer install --no-dev --prefer-dist --no-interaction --no-progress
          composer check-platform-reqs --no-dev
          vendor/bin/ai-olympus install --force
          test -f .claude/skills/resolve-issue/SKILL.md
          test -f .codex/agents/splinter.toml
          test -f .agents/skills/resolve-issue/SKILL.md
          test ! -e CLAUDE.md
          test -f vendor/pekral/ai-olympus/assets/agents/manifest.json
          test -f vendor/pekral/ai-olympus/assets/agents/activity.css
          for agent in splinter donatello leonardo raphael michelangelo april casey; do
            test -f "vendor/pekral/ai-olympus/assets/agents/$agent.png"
            test -f "vendor/pekral/ai-olympus/assets/agents/thumbnails/$agent.png"
          done
          test ! -f vendor/pekral/ai-olympus/assets/social-preview.png
          test ! -f vendor/pekral/ai-olympus/assets/logo.png
          test ! -d vendor/pekral/ai-olympus/docs
          test ! -f "$HOME/.claude/settings.json"
          rm .claude/skills/resolve-issue/SKILL.md
          composer config --json extra.ai-olympus.auto-install true
          composer update --lock --no-dev --no-interaction --no-progress
          test -f .claude/skills/resolve-issue/SKILL.md
          test ! -f "$HOME/.claude/settings.json"
